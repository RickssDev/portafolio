# Configuración de despliegue en Netlify (se lee automáticamente al conectar el repo).

[build]
  command = "npm run build"
  publish = "dist/portafolio/browser"

[build.environment]
  NODE_VERSION = "24"

# Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css): caché de 1 año.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabeceras de seguridad básicas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
