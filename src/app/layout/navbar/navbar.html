<nav class="nav" [attr.aria-label]="ui.main | tr">
  <a href="#top" class="nav__brand" (click)="menuOpen.set(false)">
    <span aria-hidden="true">{{ initials }}</span>
    <span class="sr-only">{{ profile.name }} — {{ ui.home | tr }}</span>
  </a>

  <ul id="nav-menu" class="nav__links" [class.is-open]="menuOpen()">
    @for (section of sections; track section.id) {
      <li>
        <a
          [href]="'#' + section.id"
          class="nav__link"
          [class.is-active]="activeId() === section.id"
          [attr.aria-current]="activeId() === section.id ? 'location' : null"
          (click)="menuOpen.set(false)"
        >
          {{ section.label | tr }}
        </a>
      </li>
    }
  </ul>

  <div class="nav__actions">
    <button
      type="button"
      class="nav__lang"
      (click)="i18n.toggle()"
      [attr.aria-label]="ui.switchLang | tr"
      [attr.title]="ui.switchLang | tr"
    >
      <span [class.is-current]="i18n.lang() === 'es'">ES</span>
      <span aria-hidden="true">/</span>
      <span [class.is-current]="i18n.lang() === 'en'">EN</span>
    </button>

    <button
      type="button"
      class="nav__icon-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="(theme.theme() === 'dark' ? ui.toLight : ui.toDark) | tr"
    >
      <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
    </button>

    <button
      type="button"
      class="nav__icon-btn nav__toggle"
      (click)="menuOpen.set(!menuOpen())"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="nav-menu"
      [attr.aria-label]="(menuOpen() ? ui.closeMenu : ui.openMenu) | tr"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
  </div>
</nav>

<span class="nav__progress" aria-hidden="true"></span>
